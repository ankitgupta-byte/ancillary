<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flights Ancillaries – Attach & Margin Deep Dive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  @page { size: 1600px 900px; margin: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #05070f;
    color: #eef2ff;
    display: flex; flex-direction: column; align-items: safe center;
    gap: 40px; padding: 40px 0;
  }
  #deck { display: flex; flex-direction: column; gap: 40px; }
  @media print { #deck { gap: 0; zoom: 1 !important; } }
  @media print { body { padding: 0; gap: 0; background: none; } }
  body.single { padding: 0; gap: 0; }
  body.single .slide { border-radius: 0; }

  /* Catalog slide */
  .catalog .cat-body { display: grid; grid-template-rows: auto 1fr; gap: 18px; min-height: 0; position: relative; z-index: 1; }
  .cat-strip { display: flex; align-items: center; gap: 14px; padding: 14px 22px; }
  .cat-strip .cs { flex: 1; display: flex; flex-direction: column; padding: 8px 16px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .cat-strip .cs b { font-size: 22px; font-weight: 800; color: var(--accent); }
  .cat-strip .cs span { font-size: 12px; color: #9aa6cc; margin-top: 2px; }
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 16px; min-height: 0; }
  .pcard { --c: var(--accent); display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 14px; min-height: 0; }
  .pcard .p-img { border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); border: 1px solid rgba(255,255,255,.1); }
  .pcard .p-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pcard .p-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .pcard .p-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pcard .p-name { font-size: 19px; font-weight: 800; color: var(--c); text-shadow: 0 0 16px color-mix(in srgb, var(--c) 40%, transparent); }
  .pcard .p-tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
                  color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .pcard .p-desc { font-size: 13px; line-height: 1.45; color: #d6ddf5; }
  .pcard .p-stats { margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .pcard .p-stats div { padding: 7px 8px; min-width: 0; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
  .pcard .p-stats b { display: block; font-size: 15px; white-space: nowrap; font-weight: 800; }
  .pcard .p-stats span { font-size: 9.5px; color: #9aa6cc; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

  /* Opportunity sizing slide */
  .opp .op-body { display: grid; grid-template-rows: auto 1fr; gap: 16px; min-height: 0; position: relative; z-index: 1; }
  .op-top { display: grid; grid-template-columns: 2.3fr 1fr; gap: 16px; min-height: 0; }
  .op-bars { padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }
  .op-row { display: grid; grid-template-columns: 250px 1fr 92px 84px; align-items: center; gap: 14px; }
  .op-row .op-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .op-row .op-name i { font-style: normal; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #0a0f24; background: var(--c); flex: none; }
  .op-track { position: relative; height: 22px; border-radius: 8px; background: rgba(255,255,255,.05); }
  .op-track .rng { position: absolute; top: 9px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--c) 45%, transparent); }
  .op-track .rng::before, .op-track .rng::after { content: ''; position: absolute; top: -5px; width: 2px; height: 14px; background: color-mix(in srgb, var(--c) 70%, transparent); }
  .op-track .rng::before { left: 0; } .op-track .rng::after { right: 0; }
  .op-track .mid { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 35%, transparent), var(--c)); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); }
  .op-track .proven { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 4px, transparent 4px 8px); }
  .op-row .op-v { font-size: 18px; font-weight: 800; text-align: right; color: var(--c); }
  .op-row .op-y { font-size: 12.5px; color: #b6bfdc; text-align: right; }
  .op-head { display: grid; grid-template-columns: 250px 1fr 92px 84px; gap: 14px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8e9ac0; font-weight: 600; }
  .op-head span:nth-child(n+3) { text-align: right; }
  .op-legend { font-size: 11px; color: #9aa6cc; display: flex; gap: 18px; margin-top: 2px; }
  .op-legend b { display: inline-block; width: 18px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .op-total { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .op-total .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .op-total .sub { font-size: 13px; color: #c3cbe6; line-height: 1.45; }
  .op-total .sub b { color: #fff; }
  .op-total .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13px; color: #c3cbe6; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); }
  .op-total .kv b { color: #fff; text-align: right; }
  .op-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; min-height: 0; }
  .ocard { --c: var(--accent); padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .ocard .oc-top { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; line-height: 1.2; }
  .ocard .oc-top i { font-style: normal; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #0a0f24; background: var(--c); flex: none; }
  .ocard .oc-v { font-size: 24px; font-weight: 800; color: var(--c); }
  .ocard .oc-v small { font-size: 12px; color: #9aa6cc; font-weight: 500; margin-left: 4px; }
  .ocard .oc-conf { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; align-self: flex-start;
                    color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .ocard ul { list-style: none; display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
  .ocard li { font-size: 12px; line-height: 1.4; color: #d6ddf5; padding-left: 12px; position: relative; }
  .ocard li::before { content: ''; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 2px; background: var(--c); }
  .ocard li b { color: #fff; }

  /* TravelSure sizing slide */
  .ts .ts-body { display: grid; grid-template-rows: 1fr auto; gap: 16px; min-height: 0; position: relative; z-index: 1; }
  .ts-row1 { display: grid; grid-template-columns: 1fr 1.25fr; gap: 16px; min-height: 0; }
  .ts-row1 > *, .ts .ex-row2 > * { min-width: 0; }
  .ts .p-desc { font-size: 12.5px; line-height: 1.45; color: #d6ddf5; margin-bottom: 10px; }
  .ts .p-desc b { color: #fff; }
  .abar { display: grid; grid-template-columns: 118px 1fr 44px; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; color: #c3cbe6; }
  .abar .t { height: 12px; border-radius: 4px; background: rgba(255,255,255,.05); position: relative; }
  .abar .t div { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .abar b { text-align: right; color: #fff; font-size: 12px; }
  .abar.partner .t div { background: repeating-linear-gradient(45deg, #fb7185 0 4px, #fb718566 4px 8px); }
  .abar.ours .t div { background: linear-gradient(90deg, #22d3ee66, #22d3ee); }
  .ts .sc th { text-align: right; }
  .ts .sc td.lbl { color: #b6bfdc; }
  .ts .sc tr.res td { font-size: 15px; font-weight: 800; border-top: 1px solid rgba(255,255,255,.18); color: var(--accent); }
  .ts .sc tr.res td.lbl { color: #fff; font-size: 12.5px; }
  .ts .sc th.base, .ts .sc td.base { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .sv { display: grid; grid-template-columns: 1fr 112px 34px; align-items: center; gap: 8px; font-size: 11.6px; color: #d6ddf5; padding: 2.5px 0; }
  .sv .t { position: relative; height: 11px; }
  .sv .t::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgba(255,255,255,.25); }
  .sv .t div { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .sv b { font-size: 11px; text-align: right; }
  .sv .tag { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; margin-left: 6px; }
  .sv .tag.paid { color: #fbbf24; border: 1px solid #fbbf2466; }
  .sv .tag.adj { color: #f472b6; border: 1px solid #f472b666; }
  .sv.hl { background: rgba(244,114,182,.08); border-radius: 6px; }

  /* User survey slide */
  .srv .srv-body { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; min-height: 0; position: relative; z-index: 1; }
  .srv .srv-right { display: grid; grid-template-rows: 1fr auto; gap: 16px; min-height: 0; }
  .srv-tbl { display: flex; flex-direction: column; }
  .srv-row { display: grid; grid-template-columns: 1fr 58px 58px 280px 52px 42px; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 14px; color: #dfe5fb; }
  .srv-row.head { border-top: 0; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8e9ac0; font-weight: 600; padding-top: 0; }
  .srv-row > :nth-child(n+2) { text-align: right; }
  .srv-row > :nth-child(4) { text-align: center; }
  .srv-row .dim { color: #9aa6cc; }
  .srv-row .t { position: relative; height: 16px; }
  .srv-row .t::before { content: ''; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 1px; background: rgba(255,255,255,.25); }
  .srv-row .t div { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .srv-row .pr { font-size: 11px; font-weight: 800; padding: 2px 0; border-radius: 6px; text-align: center; color: #0a0f24; }
  .srv-row .tag { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-left: 8px; vertical-align: 1px; }
  .srv-row .tag.paid { color: #fbbf24; border: 1px solid #fbbf2466; }
  .srv-row .tag.adj { color: #f472b6; border: 1px solid #f472b666; }
  .srv-row.hl { background: rgba(251,191,36,.07); }
  .srv .mgrid { grid-template-columns: 1fr; }
  .sb-tbl { display: flex; flex-direction: column; margin-top: 4px; }
  .sb-row { display: grid; grid-template-columns: 330px 1fr 64px; align-items: center; gap: 14px; padding: 9px 0; font-size: 14.5px; color: #dfe5fb; }
  .sb-row.sep { border-top: 1px solid rgba(255,255,255,.14); margin-top: 4px; padding-top: 13px; }
  .sb-row.none { color: #9aa6cc; font-style: italic; }
  .sb-row .t { height: 18px; border-radius: 5px; background: rgba(255,255,255,.05); position: relative; }
  .sb-row .t div { position: absolute; inset: 0 auto 0 0; border-radius: 5px; box-shadow: 0 0 12px rgba(255,255,255,.08); }
  .sb-row b { text-align: right; font-size: 15px; }
  .sb-row .tag { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-left: 8px; border: 1px solid; vertical-align: 1px; font-style: normal; }
  .srv-legend { display: flex; gap: 16px; font-size: 11px; color: #9aa6cc; margin-top: 10px; }

  /* Waterfall slide */
  .wf .wf-body { display: grid; grid-template-rows: 1fr auto; gap: 16px; min-height: 0; position: relative; z-index: 1; }
  .wf-chart { padding: 16px 22px 12px; display: flex; flex-direction: column; min-height: 0; }
  .wf-area { position: relative; flex: 1; display: grid; grid-template-columns: 46px 1fr; min-height: 0; }
  .wf-axis { position: relative; }
  .wf-axis span { position: absolute; right: 8px; transform: translateY(50%); font-size: 10.5px; color: #8e9ac0; }
  .wf-plot { position: relative; display: grid; grid-template-columns: repeat(13, 1fr); border-left: 1px solid rgba(255,255,255,.15); }
  .wf-grid { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,.08); }
  .wf-col { position: relative; }
  .wf-bar { position: absolute; left: 16%; right: 16%; border-radius: 6px; box-shadow: 0 0 16px color-mix(in srgb, var(--c) 40%, transparent); background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 55%, transparent)); }
  .wf-bar.total { background: linear-gradient(180deg, #e2e8f0, #64748b); box-shadow: none; }
  .wf-bar.end { background: linear-gradient(180deg, var(--accent), var(--accent2)); box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 50%, transparent); }
  .wf-bar.neg { background: repeating-linear-gradient(45deg, #fb718599 0 5px, #fb718533 5px 10px); box-shadow: none; }
  .wf-bar.proven::after { content: ''; position: absolute; inset: 0; border-radius: 6px; background: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 4px, transparent 4px 8px); }
  .wf-link { position: absolute; left: 84%; width: 32%; border-top: 1px dashed rgba(255,255,255,.35); }
  .wf-val { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 800; color: var(--c); }
  .wf-val.big { font-size: 17px; color: #fff; }
  .wf-names { display: grid; grid-template-columns: 46px repeat(13, 1fr); margin-top: 8px; }
  .wf-name { text-align: center; font-size: 11.2px; line-height: 1.3; color: #dfe5fb; padding: 0 3px; }
  .wf-name i { font-style: normal; display: inline-block; margin-top: 4px; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; border: 1px solid; }
  .wf-legend { display: flex; gap: 16px; font-size: 11px; color: #9aa6cc; margin-top: 10px; flex-wrap: wrap; }
  .wf-legend b { display: inline-block; width: 12px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .wf-row2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .wf-box { padding: 14px 18px; }
  .wf-box .panel-title { margin-bottom: 6px; }
  .wf-box p { font-size: 13px; line-height: 1.45; color: #d6ddf5; }
  .wf-box p b { color: #fff; }

  /* Growth levers slide */
  .levers .lv-body { display: grid; grid-template-rows: auto 1fr; gap: 18px; min-height: 0; position: relative; z-index: 1; }
  .formula { display: flex; align-items: center; gap: 14px; padding: 14px 22px; }
  .formula .f-label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #9aa6cc; font-weight: 600; margin-right: 6px; }
  .formula .term { display: flex; flex-direction: column; padding: 8px 16px; border-radius: 14px; background: rgba(255,255,255,.06);
                   border: 1px solid rgba(255,255,255,.12); min-width: 170px; }
  .formula .term b { font-size: 15px; font-weight: 700; }
  .formula .term span { font-size: 12px; color: #9aa6cc; margin-top: 2px; }
  .formula .term em { font-style: normal; font-size: 11px; color: var(--accent); margin-top: 4px; font-weight: 600; }
  .formula .op { font-size: 22px; color: #8e9ac0; font-weight: 300; }
  .formula .term.res { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .formula .term.res b { font-size: 22px; color: var(--accent); }
  .lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; min-height: 0; }
  .lever { --c: var(--accent); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .lever .lv-top { display: flex; align-items: center; gap: 10px; }
  .lever .lv-n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #0a0f24;
                 background: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 55%, transparent); flex: none; }
  .lever .lv-title { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .lever .lv-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .lever .lv-tags span { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
                         color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .lever .lv-stat { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
  .lever .lv-stat b { display: block; font-size: 26px; font-weight: 800; color: var(--c); letter-spacing: -.01em;
                      text-shadow: 0 0 18px color-mix(in srgb, var(--c) 40%, transparent); }
  .lever .lv-stat span { font-size: 12px; color: #b6bfdc; line-height: 1.35; display: block; margin-top: 3px; }
  .lever h4 { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #8e9ac0; font-weight: 600; }
  .lever ul { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .lever li { font-size: 12.5px; line-height: 1.4; color: #d6ddf5; padding-left: 14px; position: relative; }
  .lever li::before { content: ''; position: absolute; left: 0; top: 6px; width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
  .lever .plays li::before { border-radius: 50%; }
  .lever .lv-tests { margin-top: auto; font-size: 11.5px; color: #9aa6cc; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); line-height: 1.4; }
  .lever .lv-tests b { color: #dfe5fb; font-weight: 600; }

  /* Experiment slides */
  .exp .body { grid-template-columns: 300px 1fr; }
  .exp .hero { gap: 12px; padding: 18px; }
  .exp .hero-img { height: 150px; }
  .exp .meta { font-size: 11.5px; color: #9aa6cc; line-height: 1.5; }
  .exp .meta b { color: #dfe5fb; font-weight: 600; }
  .exp .kpi { padding: 10px 14px; }
  .exp .kpi-value { font-size: 30px; }
  .exp .kpi-row .kpi-value { font-size: 19px; }
  .exp .kpi-row .kpi-sub { font-size: 11px; }
  .exp .right { grid-template-rows: 322px 1fr; gap: 18px; }
  .ex-row1 { display: grid; grid-template-columns: 1.3fr 1fr 1.1fr; gap: 16px; min-height: 0; }
  .ex-row1 .span2 { grid-column: span 2; }
  .xt.tight td { padding: 3px 0 3px 6px; font-size: 12px; }
  .ex-row1 > *, .ex-row2 > *, .exp .right, .exp .body > * { min-width: 0; }
  .ex-row2 { display: grid; grid-template-columns: 2.15fr 1fr; gap: 16px; min-height: 0; }
  .xt { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .xt th { font-size: 10px; color: #8e9ac0; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; text-align: right; padding: 0 0 6px 6px; white-space: nowrap; }
  .xt th:first-child, .xt td:first-child { text-align: left; padding-left: 0; }
  .xt td { font-size: 12.5px; text-align: right; padding: 5px 0 5px 6px; border-top: 1px solid rgba(255,255,255,.06); color: #dfe5fb; white-space: nowrap; }
  .xt td.dim { color: #9aa6cc; }
  .xt tr.new td { color: #fff; font-weight: 600; }
  .xt tr.new td:first-child { color: var(--accent); }
  .xt tr.tot td { border-top: 1px solid rgba(255,255,255,.22); font-weight: 700; }
  .xt .pos { color: #4ade80; } .xt .neg { color: #fb7185; } .xt .ns { color: #8e9ac0; }
  .xt .dbar { display: inline-block; width: 46px; height: 8px; position: relative; vertical-align: middle; margin-left: 6px; }
  .xt .dbar::before { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,.25); }
  .xt .dbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .models { padding: 16px 18px; display: flex; flex-direction: column; min-height: 0; }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px; margin-top: 10px; flex: 1; min-height: 0; }

function crossPanel(key, mini) {
  const k = 3 + CROSS_KEYS.indexOf(key) * 2;
  const agg = rows => {
    const n = rows.reduce((a, r) => a + r[2], 0);
    return { ar: rows.reduce((a, r) => a + r[k] * r[2], 0) / n, mpi: rows.reduce((a, r) => a + r[k + 1] * r[2], 0) / n };
  };
  const pick = (rt, fb) => agg(CROSS.filter(r => (rt == null || r[0] === rt) && (fb == null || r[1] === fb)));
  const routes = ['Domestic', 'International', null], firsts = [1, 0, null];
  const inner = CROSS.map(r => r[k]);
  const max = Math.max(...inner) || 1, top = max;
  const cell = (rt, fb) => {
    const c = pick(rt, fb), tot = rt == null || fb == null;
    const bg = tot ? '' : `background: color-mix(in srgb, var(--accent) ${Math.round(6 + 34 * c.ar / max)}%, rgba(255,255,255,.03))`;
    return `<div class="xc ${tot ? 'tot' : ''} ${!tot && c.ar === top && top > 0 ? 'hi' : ''}" style="${bg}"><b>${fmtPct(c.ar)}</b><span>${fmtUsd(c.mpi)}/iti</span></div>`;
  };
  const lift = pick('International', 1).ar / pick('Domestic', 0).ar;
  const fLift = pick(null, 1).ar / pick(null, 0).ar, iLift = pick('International', null).ar / pick('Domestic', null).ar;
  return `
    <div class="${mini ? 'kpi' : 'glass panel'} cross">
      ${mini ? '<div class="kpi-label">Any attach: first/repeat × route</div>' : '<div class="panel-title">First / repeat booker × route type</div>'}
      <div class="xgrid ${mini ? 'mini' : ''}">
        <div></div><div class="xh">Domestic</div><div class="xh">${mini ? 'Intl' : 'International'}</div><div class="xh">All</div>
        ${firsts.map(fb => `<div class="xl">${fb === 1 ? 'First' : fb === 0 ? 'Repeat' : 'All'}</div>${routes.map(rt => cell(rt, fb)).join('')}`).join('')}
      </div>
      ${mini ? '' : `<div class="note-sm">First-time international bookers attach <b>${lift.toFixed(1)}x</b> as often as repeat domestic. Route lift ${iLift.toFixed(1)}x, first-booking lift ${fLift.toFixed(1)}x.</div>`}
    </div>`;
}

function panel(title, rows, labelFmt, cols, showVol, compact) {

  return `
    <div class="glass panel ${compact ? 'compact' : ''}" style="--cols:${cols}">

      <div class="panel-head"><span>Segment</span>${compact ? '' : '<span>Attach rate</span>'}<span class="r">Attach</span><span class="r">$/iti</span></div>
      <div class="rows">

            ${compact ? '' : bar(r)}

function lineChart(series, maxY, ticks, W, R, annotate) {
  const H = 200, L = 36, T = 14, B = 20;
  const x = j => L + j * (W - L - R) / (OV_TREND.length - 1);
  const y = v => T + (1 - v / maxY) * (H - T - B);
  const grid = ticks.map(v => `
    <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/>
    <text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" class="ax">${usd2(v)}</text>`).join('');
  const xl = OV_TREND.map((r, j) => j % 2 ? '' : `<text x="${x(j)}" y="${H - 4}" text-anchor="middle" class="ax">${r[0]}</text>`).join('');
  const ends = [];
  const lines = series.map(s => {
    const pts = OV_TREND.map((r, j) => `${x(j).toFixed(1)},${y(r[s.i]).toFixed(1)}`).join(' ');
    const last = OV_TREND[OV_TREND.length - 1][s.i];
    ends.push({ y: y(last), s, last });
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} ${s.glow ? 'filter="url(#glow)"' : ''}/>`;
  }).join('');
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 13);
  const overflow = ends.length ? ends[ends.length - 1].y - (H - B) : 0;
  if (overflow > 0) ends.forEach(e => e.y -= overflow);
  const labels = ends.map(e => `<text x="${W - R + 7}" y="${e.y + 4}" class="lab" fill="${e.s.color}">${e.s.name} ${usd2(e.last)}</text>`).join('');
  const ann = (annotate || []).map(([j, i, below]) => {
    const v = OV_TREND[j][i];
    return `<circle cx="${x(j)}" cy="${y(v)}" r="3.5" fill="#fff"/><text x="${x(j)}" y="${below ? y(v) + 17 : y(v) - 8}" text-anchor="middle" class="ann">${usd2(v)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <defs><filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${grid}${xl}${lines}${ann}${labels}</svg>`;
}

  const gap = ROUTE_KEYS.reduce((t, k) => t + adj(k, 1) - P.app[k][1], 0);
  const uplift = gap * PLATFORM_CLOSE * P.app.n / itisAll;
  const attachFx = ROUTE_KEYS.reduce((t, k) => t + (adj(k, 0) - P.app[k][0]) / 100 * P.app[k][2], 0);
  const bridge = [['App', 0, mpi('app'), 'base'], ['More buyers', mpi('app'), attachFx, 'up'], ['Higher price / sale', mpi('app') + attachFx, gap - attachFx, 'up'],
    ['More international', mpi('app') + gap, mpi('web') - mpi('app') - gap, 'mix'], ['Desktop', 0, mpi('web'), 'end']];
  const bh = v => v / mpi('web') * 150;
  const x = (a, b) => `<span class="pf-x">${(b / a).toFixed(1)}×</span>`;
  const maxMpi = Math.max(...ROUTE_KEYS.map(k => P.web[k][1]));
  const cards = ['app', 'web', 'mweb'].map(p => {
    const m = mpi(p);
    return `<div class="glass pf-card ${p}">
      <div class="pf-top"><div class="pf-name">${P[p].name}</div><div class="pf-val">$${m.toFixed(2)}<span> / iti</span></div></div>
      <div class="pf-sub">${(P[p].n / itisAll * 100).toFixed(0)}% of itineraries · ${(P[p].n * m / totM * 100).toFixed(0)}% of margin · ${(P[p].intl / P[p].n * 100).toFixed(0)}% international</div>
      <div class="pf-stack">${ROUTE_KEYS.map(k => `<i style="width:${P[p][k][1] / mpi('web') * 100}%;background:${ANCILLARIES.find(a => a.key === k).accent}"></i>`).join('')}</div>
    </div>`;
  }).join('');
  const rows = ANCILLARIES.map(a => {
    const k = a.key, A = P.app[k], W = P.web[k], g = adj(k, 1) - A[1];
    const ar = v => v < 0.1 ? v.toFixed(3) : v.toFixed(2);
    return `<tr>
      <td><span class="pf-dot" style="background:${a.accent}"></span>${a.name}</td>
      <td class="dim">${ar(A[0])}%</td><td>${ar(W[0])}%</td><td>${x(A[0], W[0])}</td>
      <td class="dim">$${A[2].toFixed(2)}</td><td>$${W[2].toFixed(2)}</td><td>${x(A[2], W[2])}</td>
      <td class="pf-bars"><div><i class="a" style="width:${A[1] / maxMpi * 100}%"></i></div><div><i class="w" style="width:${W[1] / maxMpi * 100}%;background:${a.accent}"></i></div></td>
      <td class="dim">$${A[1].toFixed(3)}</td><td>$${W[1].toFixed(3)}</td>
      <td class="pos">+$${g.toFixed(3)}</td>
    </tr>`;
  }).join('');
  return `
  <section class="slide pf" style="--accent:#38bdf8;--accent2:#a78bfa">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

    <div class="header">
      <div>
        <div class="eyebrow">Platform deep dive · app vs desktop</div>

      </div>
      <div class="chips">
        <div class="glass chip">Last 90 days · ${fmtNum(itisAll)} itineraries</div>
      </div>
    </div>

    <div class="pf-body">
      <div class="pf-left">
        ${cards}
        <div class="pf-legend">${ANCILLARIES.map(a => `<span><i style="background:${a.accent}"></i>${a.name}</span>`).join('')}</div>
      </div>
      <div class="glass panel">
        <div class="panel-title">Six add-ons: app vs desktop</div>
        <table class="xt pf-t">
          <tr><th>Add-on</th><th colspan="3" style="text-align:center">Attach · app / desktop</th><th colspan="3" style="text-align:center">Margin per sale</th><th colspan="3" style="text-align:center">Margin per itinerary</th><th>Like-for-like gap</th></tr>
          ${rows}
          <tr class="tot"><td>All add-ons</td><td colspan="6"></td><td></td><td class="dim">$${mpi('app').toFixed(2)}</td><td>$${mpi('web').toFixed(2)}</td><td class="pos">+$${gap.toFixed(2)}</td></tr>
        </table>
        <div class="note-sm"><b>Like-for-like gap</b> = desktop margin per itinerary re-weighted to the app's route mix (${(wi * 100).toFixed(0)}% international vs ${(P.web.intl / P.web.n * 100).toFixed(0)}% on desktop), minus the app. Grey = app, colour = desktop. CEG = revenue, Plus and Premium.</div>
        <div class="panel-title" style="margin-top:14px">Bridge: app to desktop margin per itinerary</div>
        <div class="pf-bridge">${bridge.map(([l, b, v, c]) => `<div class="pf-bcol ${c}"><b>${c === 'base' || c === 'end' ? '$' + v.toFixed(2) : '+$' + v.toFixed(2)}</b><div class="pf-bwrap"><i style="height:${bh(v)}px;margin-bottom:${bh(b)}px"></i></div><span>${l}</span></div>`).join('')}
          <div class="pf-bnote">Same route mix, desktop sells to <b>more buyers</b> (+$${attachFx.toFixed(2)}) and at a <b>higher price per sale</b> (+$${(gap - attachFx).toFixed(2)}). Desktop's heavier international mix adds only $${(mpi('web') - mpi('app') - gap).toFixed(2)}.</div>
        </div>
      </div>
      <div class="glass insights">
        <div class="panel-title">What it tells us</div>
        <ul>
          <li><b>App is ${(P.app.n / itisAll * 100).toFixed(0)}% of itineraries but ${(P.app.n * mpi('app') / totM * 100).toFixed(0)}% of margin.</b> Every add-on sells better on desktop, even on the same route mix (1.2–1.8× attach).</li>
          <li><b>Price per sale is half the story.</b> Seats earn $${P.web.seat[2].toFixed(2)} vs $${P.app.seat[2].toFixed(2)} per sale on desktop, CEG $${P.web.ceg[2].toFixed(2)} vs $${P.app.ceg[2].toFixed(2)}: app buyers pick cheaper seats and CEG Plus (Premium is ${(P.app.ceg_prem / P.app.ceg[0] * 100).toFixed(0)}% of app CEG vs ${(P.web.ceg_prem / P.web.ceg[0] * 100).toFixed(0)}% on desktop).</li>
          <li><b>Not just screen size.</b> Mobile web matches desktop on seat attach (${P.mweb.seat[0].toFixed(1)}% vs ${P.web.seat[0].toFixed(1)}%) and beats the app on all six, so the app flow itself leaves money behind.</li>
          <li><b>Biggest app gaps:</b> Luggage Protection (${(P.web.lp[0] / P.app.lp[0]).toFixed(1)}× attach) and Trip Protection (${(P.web.tp[0] / P.app.tp[0]).toFixed(1)}×). Start with the protection placement and the seat and CEG tier defaults in the app.</li>
        </ul>
        <div class="kpi pf-opp">
          <div class="kpi-label">If the app closes ${PLATFORM_CLOSE * 100}% of the like-for-like gap</div>
          <div class="kpi-value" style="color:#4ade80">+$${uplift.toFixed(2)}<span style="font-size:14px;color:#9aa6cc;font-weight:500"> / itinerary overall</span></div>

      <div>Flights Ancillaries · Product Learnings</div>
    </div>

function waterfallSlide() {
  const base = 1.36, overlap = 0.15, itisYr = RAW.all[0][1] * 365 / 90;

  const evC = { Proven: '#4ade80', Measured: '#22d3ee', Estimate: '#8e9ac0' };
  const gross = WATERFALL.reduce((t, w) => t + w[1], 0), hair = gross * overlap, end = base + gross - hair;
  const lo = 1.2, hi = 1.95, y = v => ((v - lo) / (hi - lo) * 100).toFixed(2) + '%';
  const cols = [], names = [];
  const col = (bottom, top, cls, c, val, valCls = '', link = true) => cols.push(`
          <div class="wf-col" style="--c:${c}">

            ${link ? `<div class="wf-link" style="bottom:${y(top)}"></div>` : ''}

  col(lo, base, 'total', '#e2e8f0', '$' + base.toFixed(2), 'big');
  names.push('<div class="wf-name"><b>Today</b><br>last 90 days</div>');
  let run = base;
  WATERFALL.forEach(([n, v, l, ev]) => {
    col(run, run + v, ev === 'Proven' ? 'proven' : '', lvColor[l], '+$' + v.toFixed(3).replace(/0$/, ''));
    names.push(`<div class="wf-name">${n}<br><i style="color:${evC[ev]};border-color:${evC[ev]}66">${ev}</i></div>`);
    run += v;
  });
  col(run - hair, run, 'neg', '#fb7185', '−$' + hair.toFixed(3));
  names.push(`<div class="wf-name">Overlap between initiatives<br><i style="color:#fb7185;border-color:#fb718566">−${overlap * 100}%</i></div>`);
  col(lo, end, 'end', '#fff', '$' + end.toFixed(2), 'big', false);
  names.push(`<div class="wf-name"><b>Potential</b><br>+${Math.round((end - base) / base * 100)}%</div>`);
  const ticks = [1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9];
  const usdM = v => '$' + (v * itisYr / 1e6).toFixed(1) + 'M';
  const proven = WATERFALL.filter(w => w[3] !== 'Estimate').reduce((t, w) => t + w[1], 0);
  const cov = WATERFALL.filter(w => w[2] === 6).reduce((t, w) => t + w[1], 0);
  const price = WATERFALL.filter(w => w[2] === 4 || w[2] === 5).reduce((t, w) => t + w[1], 0);
  return `

    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

    <div class="header">

        <div class="subtitle">Ten initiatives ranked by size; together +$${(end - base).toFixed(2)} per itinerary (+${Math.round((end - base) / base * 100)}%) after overlap</div>
      </div>
      <div class="chips">
        <div class="glass chip">~${usdM(end - base)} a year</div>
        <div class="glass chip">Baseline: last 90 days</div>
      </div>
    </div>

    <div class="wf-body">
      <div class="glass wf-chart">
        <div class="wf-area">
          <div class="wf-axis">${ticks.map(t => `<span style="bottom:${y(t)}">$${t.toFixed(2)}</span>`).join('')}</div>
          <div class="wf-plot">
            ${ticks.map(t => `<div class="wf-grid" style="bottom:${y(t)}"></div>`).join('')}
            ${cols.join('')}
          </div>
        </div>
        <div class="wf-names"><div></div>${names.join('')}</div>
        <div class="wf-legend">
          ${[6, 3, 2, 4, 5].map(l => `<span><b style="background:${lvColor[l]}"></b>${lvName[l]}</span>`).join('')}
          <span><b style="background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)"></b>Proven in A/B test</span>
          <span>Axis starts at $1.20</span>
        </div>
      </div>
      <div class="wf-row2">
        <div class="glass wf-box"><div class="panel-title">Lock in what is proven</div><p><b>+$${proven.toFixed(3)}</b> already measured: Premium-only CEG is live at 100%, and CFAR showed +$0.022 in test. Ship and protect these first.</p></div>
        <div class="glass wf-box"><div class="panel-title">Biggest bets: coverage and app</div><p><b>+$${cov.toFixed(3)}</b> from seat and bag coverage plus <b>+$0.08</b> from app parity. Needs connector and app-flow investment; size with an engineering plan.</p></div>
        <div class="glass wf-box"><div class="panel-title">Cheap tests to run next</div><p><b>+$${price.toFixed(3)}</b> from pricing and personalization: bag price points, non-airline dynamic pricing, one protection offer per user, family prompts.</p></div>

}

const zProp = (pA, pB, nA, nB) => {
  const p = (pA * nA + pB * nB) / (nA + nB) / 100;
  const se = Math.sqrt(p * (1 - p) * (1 / nA + 1 / nB));
  return se ? (pB - pA) / 100 / se : 0;
};
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '±');
const fmtPP = v => sgn(v) + Math.abs(v).toFixed(2) + 'pp';
const fmtRel = v => Math.abs(v) < 0.05 ? '0.0%' : sgn(v) + Math.abs(v).toFixed(1) + '%';
const fmtD = v => sgn(v) + '$' + Math.abs(v).toFixed(3);
const cls = (v, sig) => (!sig ? 'ns' : v > 0 ? 'pos' : 'neg');
const dbar = (v, max, c) => {
  const w = Math.min(50, Math.abs(v) / max * 50);
  return `<span class="dbar"><i style="${v >= 0 ? 'left:50%' : `left:${50 - w}%`};width:${w}%;background:${c}"></i></span>`;
};

function expSlide(e, idx) {
  const [nA, nB] = e.n;
  const dTot = e.total[1] - e.total[0];
  const zTot = dTot / Math.sqrt(e.sd[0] ** 2 / nA + e.sd[1] ** 2 / nB);
  const nw = e.products.find(p => p[5]);
  const others = e.products.filter(p => !p[5]);
  const dOther = others.filter(p => !['Paid Bags', 'Paid Seats'].includes(p[0])).reduce((a, p) => a + p[4] - p[3], 0);
  const prodRows = e.products.map(p => {
    const rel = p[1] ? (p[2] - p[1]) / p[1] * 100 : null;
    const z = zProp(p[1], p[2], nA, nB), sig = Math.abs(z) >= 1.96;
    const c = !sig ? 'rgba(142,154,192,.6)' : rel == null || rel > 0 ? '#4ade80' : '#fb7185';
    return `<tr class="${p[5] ? 'new' : ''}"><td>${p[0]}</td><td class="dim">${fmtPct(p[1])}</td><td>${p[1] && p[2] === 0 ? '<span class="dim">hidden</span>' : fmtPct(p[2])}</td>
      <td class="${rel == null ? 'pos' : cls(rel, sig)}">${rel == null ? 'new' : fmtRel(rel)}${sig && rel != null ? '*' : ''}${dbar(rel == null ? 8 : rel, 8, c)}</td>
      <td class="${p[4] - p[3] >= 0 ? 'pos' : 'neg'}" style="opacity:${p[5] || sig ? 1 : .6}">${fmtD(p[4] - p[3])}</td></tr>`;
  }).join('');
  const zAny = zProp(e.any[0], e.any[1], nA, nB);
  const totRows = `
    <tr class="tot"><td>Any ancillary</td><td class="dim">${fmtPct(e.any[0])}</td><td>${fmtPct(e.any[1])}</td>
      <td class="${cls(e.any[1] - e.any[0], Math.abs(zAny) >= 1.96)}">${fmtPP(e.any[1] - e.any[0])}${Math.abs(zAny) >= 1.96 ? '*' : ''}</td>
      <td class="${cls(dTot, Math.abs(zTot) >= 1.96)}">${fmtD(dTot)}</td></tr>`;
  const pfRows = (e.platform || []).map((r, i) => {
    const dO = r[5] - r[4], zO = zProp(r[4], r[5], r[1], r[2]);
    const tp = e.tpPlatform[i], dTp = (tp[1] - tp[0]) / tp[0] * 100, zTp = zProp(tp[0], tp[1], r[1], r[2]);
    const dM = (r[7] - r[6]) / r[6] * 100;
    return `<tr><td>${r[0]}<span style="color:#8e9ac0;font-size:10.5px"> ${Math.round(r[1] / nA * 100)}%</span></td><td>${fmtPct(r[3])}</td>
      <td class="${cls(dTp, Math.abs(zTp) >= 1.96)}">${fmtRel(dTp)}${Math.abs(zTp) >= 1.96 ? '*' : ''}</td>
      <td class="${cls(dO, Math.abs(zO) >= 1.96)}">${fmtPP(dO)}${Math.abs(zO) >= 1.96 ? '*' : ''}</td>
      <td class="${dM >= 0 ? 'pos' : 'neg'}">${fmtRel(dM)}</td></tr>`;
  }).join('');
  const crRows = (e.cross || []).map(r => {
    const dTp = (r[6] - r[5]) / r[5] * 100, zTp = zProp(r[5], r[6], r[1], r[2]);
    const dM = (r[8] - r[7]) / r[7] * 100;
    return `<tr><td>${r[0]}</td><td>${fmtPct(r[3])}</td><td class="dim">$${r[4].toFixed(2)}</td>
      <td class="${cls(dTp, Math.abs(zTp) >= 1.96)}">${fmtRel(dTp)}${Math.abs(zTp) >= 1.96 ? '*' : ''}</td>
      <td class="${dM >= 0 ? 'pos' : 'neg'}">${fmtRel(dM)}</td></tr>`;
  }).join('');
  const r = e.alloc[1] / e.alloc[0];
  const volD = (b, a) => (b / (a * r) - 1) * 100;
  const dItis = volD(nB, nA), dBk = volD(e.bookers[1], e.bookers[0]);

            <div><b style="${volCls(dBk)}">${fmtRel(dBk)}</b><span>bookers<br>95% CI ±${ciBk.toFixed(1)}%</span></div>

          </div>
          <div class="vfoot">${Math.abs(dBk) < ciBk ? '<b>No significant change</b> in bookers.' : `<b>Significant ${dBk > 0 ? 'gain' : 'loss'}</b> in bookers.`} Calculon bookings ${fmtRel(dCalc)}. Adjusted for allocation split (B/A ${r.toFixed(4)}).</div>
        </div>`;
  const volPanel = vp => {
    const head = { seat: 'Δ seats', bag: 'Δ bags', itis: 'Δ itins', bookers: 'Δ bookers', margin: 'Δ margin' };
    const cell = (c, x) => {
      if (c === 'seat' || c === 'bag') {
        const [a, b] = c === 'seat' ? [x[5], x[6]] : [x[7], x[8]];
        const d = (b - a) / a * 100, sig = Math.abs(zProp(a, b, x[1], x[2])) >= 1.96;
        return `<td class="${cls(d, sig)}">${fmtRel(d)}${sig ? '*' : ''}</td>`;
      }
      const [a, b] = c === 'itis' ? [x[1], x[2]] : c === 'bookers' ? [x[3], x[4]] : [x[9], x[10]];
      const d = volD(b, a);
      return `<td class="${d >= 0 ? 'pos' : 'neg'}">${fmtRel(d)}</td>`;
    };
    return `
          <div class="glass panel">
            <div class="panel-title">${vp.title}</div>
            <table class="xt">
              <tr><th>Segment</th>${vp.cols.map(c => `<th>${head[c]}</th>`).join('')}</tr>
              ${vp.rows.map(x => `<tr><td>${x[0]}</td>${vp.cols.map(c => cell(c, x)).join('')}</tr>`).join('')}
            </table>
            <div class="note-sm">${vp.note}</div>
          </div>`;
  };
  const totM = [nA * e.total[0], nB * e.total[1]], dTotM = volD(totM[1], totM[0]);
  const gainDay = e.days ? (totM[1] / r - totM[0]) / e.days * 2 : 0, gainDayRate = e.days ? dTot * nB / e.days * 2 : 0;
  const shot = e.bside ? [e.bside, 'B', 'treatment'] : e.aside ? [e.aside, 'A', 'control'] : null;
  const ctyPanel = c => {
    const head = c.mode === 'plus' ? ['Plus A', 'Premium A → B', 'Upgrade'] : ['CEG A', 'Plus B', 'Δ CEG buyers'];
    const rows = c.rows.map(([n, iA, iB, bA, bB, p, q, t, cA, cB, mA, mB]) => {
      const dCeg = (cB - cA) / cA * 100, dM = ((mB / iB) / (mA / iA) - 1) * 100, dB = volD(bB, bA);
      let mid;
      if (c.mode === 'plus') mid = `<td class="dim">${fmtPct(p)}</td><td>${fmtPct(q)} → ${fmtPct(t)}</td><td>${Math.round((t - q) / p * 100)}%</td>`;
      else {
        const d = (t - p) / p * 100, sig = Math.abs(zProp(p, t, iA, iB)) >= 1.96;
        mid = `<td class="dim">${fmtPct(p)}</td><td>${fmtPct(t)}</td><td class="${cls(d, sig)}">${fmtRel(d)}${sig ? '*' : ''}</td>`;
      }
      return `<tr><td>${n}<span style="color:#8e9ac0;font-size:10.5px"> ${fmtNum(iA + iB)}</span></td>${mid}<td class="${dCeg >= 0 ? 'pos' : 'neg'}">${fmtRel(dCeg)}</td><td class="${dM >= 0 ? 'pos' : 'neg'}">${fmtRel(dM)}</td><td class="dim">${fmtRel(dB)}</td></tr>`;
    }).join('');
    return `
          <div class="glass panel span2">
            <div class="panel-title">${c.title}</div>
            <table class="xt tight">
              <tr><th>Origin country · itins</th>${head.map(h => `<th>${h}</th>`).join('')}<th>Δ CEG $/iti</th><th>Δ total $/iti</th><th>Δ bookers</th></tr>
              ${rows}
            </table>
            <div class="note-sm">${c.note}</div>
          </div>`;
  };
  const models = e.models.map(m => `
    <div class="mtile"><div class="mq"><b>${m.q}</b><span class="vd ${m.v}">${m.vl}</span></div><p>${m.t}</p></div>`).join('');
  return `
  <section class="slide exp" style="--accent:${e.accent};--accent2:${e.accent2}">

        <div class="glass chip">${fmtNum(nA + nB)} itineraries in test</div>
        ${shot ? `<button class="glass chip bside-btn" data-img="${shot[0]}" data-cap="${e.name} · ${shot[1]}-side (${shot[2]})">&#9638; View ${shot[1]}-side</button>` : ''}
      </div>
    </div>

    <div class="body">
      <div class="glass hero">
        <div class="hero-img"><img src="${e.img}" alt="${e.name}"></div>

        <div class="kpi">
          <div class="kpi-label">${e.focusLabel || e.short + ' attach in treatment'}</div>
          <div class="kpi-value accent">${fmtPct(nw[2])}</div>
          <div class="kpi-sub">${nw[1] ? `vs ${fmtPct(nw[1])} in control · ${fmtRel((nw[2] - nw[1]) / nw[1] * 100)} (z = ${zProp(nw[1], nw[2], nA, nB).toFixed(1)})` : `$${(nw[4] / nw[2] * 100).toFixed(2)} margin per sale · ${fmtUsd(nw[4])} per itinerary`}</div>
        </div>
        <div class="kpi-row">
          ${e.days ? `<div class="kpi"><div class="kpi-label">Margin gain / day</div><div class="kpi-value" style="color:#4ade80">+$${(gainDay / 1000).toFixed(1)}K</div><div class="kpi-sub">${fmtD(dTot)}/iti · ${fmtRel(dTot / e.total[0] * 100)} · z = ${zTot.toFixed(1)}</div></div>`
          : e.totalMode === 'volume'
            ? `<div class="kpi"><div class="kpi-label">Total anc. margin</div><div class="kpi-value" style="color:${Math.abs(dTotM) < 0.05 ? '#e2e8f0' : dTotM > 0 ? '#4ade80' : '#fb7185'}">${fmtRel(dTotM)}</div><div class="kpi-sub">$/iti flat (${fmtD(dTot)})</div></div>`
            : `<div class="kpi"><div class="kpi-label">Portfolio $/iti</div><div class="kpi-value" style="color:${dTot >= 0 ? '#4ade80' : '#fb7185'}">${fmtD(dTot)}</div><div class="kpi-sub">${fmtRel(dTot / e.total[0] * 100)} · z = ${zTot.toFixed(1)}</div></div>`}
          <div class="kpi"><div class="kpi-label">Calculon</div><div class="kpi-value" ${e.calculon[0] === 'Win' ? 'style="color:#4ade80"' : ''}>${e.calculon[0]}</div><div class="kpi-sub">${e.calculon[1]}</div></div>
        </div>
        ${vol}
        ${e.heroNote ? `<div class="meta">${e.days ? `<b>Gain/day</b> = B − A ancillary margin per day × 2 (50/50 split): ~$${(gainDay * 365 / 1e6).toFixed(2)}M a year; $${(gainDayRate / 1000).toFixed(1)}K/day from higher $/iti alone. ` : ''}${e.heroNote}</div>` : `<div class="meta">Of ${e.short}'s ${fmtUsd(nw[4])}/iti, <b>${Math.round(Math.max(0, -dOther) / nw[4] * 100)}%</b> (${fmtUsd(Math.max(0, -dOther))}) was taken from other non-airline add-ons. Bags and seats attach did not move significantly.</div>`}

        * = attach difference significant at 95% (two-proportion z-test). Margin = booking-time values (CEG = revenue). ${e.note}
      </div>
      <div>Flights Ancillaries · Product Learnings</div>
    </div>
  </section>`;
}

const only = new URLSearchParams(location.search).get('s');
if (only) {
  document.body.classList.add('single');
  document.getElementById('deck').innerHTML = only === '0' ? overviewSlide() : slide(ANCILLARIES[only - 1], only - 1);
} else {
  const deck = document.getElementById('deck');
  deck.innerHTML = titleSlide() + catalogSlide() + overviewSlide() + ANCILLARIES.map(slide).join('') + platformSlide() + leversSlide() + EXPERIMENTS.map(expSlide).join('') + surveySlide() + travelSureSlide() + opportunitySlide() + waterfallSlide();
  document.body.classList.add('present');
  document.body.insertAdjacentHTML('beforeend', `
    <button class="nav-btn prev" aria-label="Previous slide">&#8249;</button>
    <button class="nav-btn next" aria-label="Next slide">&#8250;</button>
    <div class="nav-bar"><span class="count"></span><button class="fs" title="Fullscreen (F)">&#x26F6; Fullscreen</button></div>
    <div class="bside-modal"><div class="bside-box"><button class="bside-close" aria-label="Close">&times;</button><img alt=""><div class="bside-cap"></div></div></div>`);
  const modal = document.querySelector('.bside-modal');
  const closeModal = () => modal.classList.remove('open');
  deck.addEventListener('click', ev => {
    const b = ev.target.closest('.bside-btn');
    if (!b) return;
    modal.querySelector('img').src = b.dataset.img;
    modal.querySelector('.bside-cap').textContent = b.dataset.cap;
    modal.classList.add('open');
  });
  modal.addEventListener('click', ev => { if (ev.target === modal || ev.target.closest('.bside-close')) closeModal(); });
  const slides = [...deck.querySelectorAll('.slide')];
  const prevBtn = document.querySelector('.nav-btn.prev'), nextBtn = document.querySelector('.nav-btn.next');
  const count = document.querySelector('.nav-bar .count');
  let cur = 0;
  const go = n => {
    cur = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((el, i) => el.classList.toggle('active', i === cur));
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === slides.length - 1;
    count.textContent = `${cur + 1} / ${slides.length}`;
    history.replaceState(null, '', '#' + (cur + 1));
  };
  const fit = () => {
    const pad = document.fullscreenElement ? 0 : 24;
    deck.style.setProperty('--k', Math.min((innerWidth - pad) / 1600, (innerHeight - pad) / 900));
  };
  const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  prevBtn.onclick = () => go(cur - 1);
  nextBtn.onclick = () => go(cur + 1);
  document.querySelector('.nav-bar .fs').onclick = toggleFs;
  document.addEventListener('keydown', e => {
    if (modal.classList.contains('open')) {
      if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') closeModal();
      return;
    }
    if ((e.key === 'b' || e.key === 'B') && slides[cur].querySelector('.bside-btn')) slides[cur].querySelector('.bside-btn').click();
    else if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });
  let idle;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.add('idle'), 2500);
  });
  window.addEventListener('resize', fit);
  fit();
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
}
</script>
</body>
</html>
